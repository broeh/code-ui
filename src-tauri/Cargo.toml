[package]
name = "code-ui"
version = "0.1.0-alpha.1"
description = "A desktop app for coding agents"
authors = ["Hans Broerse"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "code_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-window-state = "2.5.0"
dirs = "7.0.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.28.0", features = ["v4", "v7"] }
libc = "0.2.190"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tauri-plugin-dialog = "2.8.2"
ignore = "0.4.33"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
trash = "5.2.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Quicker test builds with tools/install.sh --fast. The release profile stays as it is.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
